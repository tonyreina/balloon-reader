# Publishes the game to GitHub Pages.
#
# The speech model is not in the repository (it is ~40MB of binary data), so this
# fetches it during the build and ships it with the site. That keeps git history
# small while still giving visitors a game that runs entirely in their browser.
#
# Action versions are kept current because GitHub retires the Node runtime they
# run on: anything still targeting Node 20 is forced onto a newer one and warns.
# All five below target Node 24, and upload-pages-artifact@v5 pulls in
# upload-artifact@v7 internally, which is what the warning about v4 referred to.
#
# Before the first run, turn Pages on:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
# Until that is done this workflow fails on the "configure-pages" step.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Nothing reaches a child without these passing. Before this existed, a word added
  # to js/sentences.js or a <script src> pointing at another host went live within a
  # minute with nothing having looked at it: both test suites were advisory, and only
  # protected the project if somebody remembered to run them.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Playwright's Chromium
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Reading content is fit for a child
        run: node tests/content.test.mjs

      - name: Guardrails hold - content filter, and the browser refuses to send anything out
        run: node tests/guardrails.test.mjs

      - name: Game rules
        run: node tests/logic.test.mjs

      - name: What the game remembers
        run: node tests/store.test.mjs

      - name: Transcript handling
        run: node tests/recognizer.test.mjs

      - name: Scene and wildlife
        run: node tests/scene.test.mjs

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Fetch the Vosk speech model
        run: python tools/fetch_model.py

      - name: Assemble the site
        run: |
          mkdir -p site
          cp index.html site/
          cp -r css js vendor fonts models site/
          # Serve every file verbatim rather than running it through Jekyll.
          touch site/.nojekyll
          echo "site contents:"
          du -sh site/*

      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    needs: build
    # A pull request gets the checks but never publishes.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
